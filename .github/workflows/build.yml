name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cvsj_pilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, fileinfo, mbstring, mysqli, zip

      - name: Read plugin version
        id: plugin_version
        run: |
          PLUGIN_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check PHP syntax
        run: find change-vigil-site-journal -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build installable archive
        run: npm run package

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable WordPress
        run: |
          WORDPRESS_VERSION=7.1.4
          WP_ROOT="$RUNNER_TEMP/wordpress"
          curl -fsSL "https://wordpress.org/wordpress-${WORDPRESS_VERSION}.zip" -o "$RUNNER_TEMP/wordpress.zip"
          unzip -q "$RUNNER_TEMP/wordpress.zip" -d "$RUNNER_TEMP"
          cp "$WP_ROOT/wp-config-sample.php" "$WP_ROOT/wp-config.php"
          sed -i 's/database_name_here/cvsj_pilot/; s/username_here/root/; s/password_here/root/; s/localhost/127.0.0.1:3306/' "$WP_ROOT/wp-config.php"
          PILOT_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          PLUGIN_VERSION="$(node -p "require('./package.json').version")"
          php tools/site.php "$WP_ROOT" "release/change-vigil-site-journal.${PLUGIN_VERSION}.zip" "http://127.0.0.1:8080" "$PILOT_PASSWORD"
          cp tools/cvsj-fixture.php "$WP_ROOT/cvsj-fixture.php"
          echo "::add-mask::$PILOT_PASSWORD"
          echo "PILOT_PASSWORD=$PILOT_PASSWORD" >> "$GITHUB_ENV"
          php -S 127.0.0.1:8080 -t "$WP_ROOT" > "$RUNNER_TEMP/wordpress-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/wp-login.php; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wordpress-server.log"
          exit 1

      - name: Run security and interface checks
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:quality -- http://127.0.0.1:8080 "$PILOT_PASSWORD" "$RUNNER_TEMP/test-results"

      - name: Run full activity pilot
        env:
          CVSJ_SKIP_REGRESSION: "1"
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:pilot -- http://127.0.0.1:8080 "$PILOT_PASSWORD" full "$RUNNER_TEMP/test-results"

      - name: Verify coexistence and isolated uninstall
        run: |
          LEGACY_ZIP="$RUNNER_TEMP/activity-log-for-admins.1.2.1.zip"
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v1.2.1/activity-log-for-admins.1.2.1.zip -o "$LEGACY_ZIP"
          echo "762b74e0b15064e5c21767a1304cde058f955e20f4ab81cf883d8cbf29d681bf  $LEGACY_ZIP" | sha256sum --check
          for target in cvsj alfa; do
            php tools/coexistence-smoke.php "$RUNNER_TEMP/wordpress" "$LEGACY_ZIP" setup "$target"
            php tools/coexistence-smoke.php "$RUNNER_TEMP/wordpress" "$LEGACY_ZIP" verify "$target"
          done

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-vigil-site-journal-test-evidence
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: change-vigil-site-journal-${{ steps.plugin_version.outputs.version }}
          path: release/change-vigil-site-journal.${{ steps.plugin_version.outputs.version }}.zip
          if-no-files-found: error

  compatibility:
    name: WordPress ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.9.11"
            php: "8.3"
          - wordpress: "7.0.8"
            php: "8.4"
          - wordpress: "7.1.4"
            php: "8.5"
    services:
      mariadb:
        image: mariadb:11.4.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cvsj_pilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mysqli, zip, :mbstring

      - name: Read plugin version
        id: plugin_version
        run: |
          PLUGIN_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Download installable archive
        uses: actions/download-artifact@v4
        with:
          name: change-vigil-site-journal-${{ steps.plugin_version.outputs.version }}
          path: release

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable WordPress
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          WP_ROOT="$RUNNER_TEMP/wordpress"
          curl -fsSL "https://wordpress.org/wordpress-${WORDPRESS_VERSION}.zip" -o "$RUNNER_TEMP/wordpress.zip"
          unzip -q "$RUNNER_TEMP/wordpress.zip" -d "$RUNNER_TEMP"
          cp "$WP_ROOT/wp-config-sample.php" "$WP_ROOT/wp-config.php"
          sed -i 's/database_name_here/cvsj_pilot/; s/username_here/root/; s/password_here/root/; s/localhost/127.0.0.1:3306/' "$WP_ROOT/wp-config.php"
          PILOT_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          PLUGIN_VERSION="${{ steps.plugin_version.outputs.version }}"
          php tools/site.php "$WP_ROOT" "release/change-vigil-site-journal.${PLUGIN_VERSION}.zip" "http://127.0.0.1:8080" "$PILOT_PASSWORD"
          cp tools/cvsj-fixture.php "$WP_ROOT/cvsj-fixture.php"
          echo "::add-mask::$PILOT_PASSWORD"
          echo "PILOT_PASSWORD=$PILOT_PASSWORD" >> "$GITHUB_ENV"
          php -S 127.0.0.1:8080 -t "$WP_ROOT" > "$RUNNER_TEMP/wordpress-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/wp-login.php; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wordpress-server.log"
          exit 1

      - name: Check install, REST access, and Settings
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:pilot -- http://127.0.0.1:8080 "$PILOT_PASSWORD" smoke "$RUNNER_TEMP/test-results"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-wp-${{ matrix.wordpress }}-php-${{ matrix.php }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
